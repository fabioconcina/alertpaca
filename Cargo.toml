[package]
name = "alertpaca"
version = "0.11.1"
edition = "2024"
rust-version = "1.95"
description = "Proactive server health checker: what's about to go wrong?"
license = "MIT"
repository = "https://github.com/fabioconcina/alertpaca"
keywords = ["monitoring", "health-check", "server", "tui", "mcp"]
categories = ["command-line-utilities"]

[dependencies]
ratatui = "0.30"
crossterm = "0.29"
sysinfo = "0.40"
rustls = { version = "0.23", default-features = false, features = ["ring", "logging", "std", "tls12"] }
webpki-roots = "1"
x509-parser = "0.18"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"
chrono = { version = "0.4", features = ["serde"] }
dirs = "7"
glob = "0.3"
libc = "0.2"
clap = { version = "4", features = ["derive"] }
anyhow = "1"

[profile.release]
strip = true
lto = true
codegen-units = 1
